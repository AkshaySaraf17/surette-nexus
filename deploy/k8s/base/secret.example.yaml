# NOT applied by kustomize. The keys the apps expect in the "surette-secrets" Secret.
apiVersion: v1
kind: Secret
metadata:
  name: surette-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://surette:CHANGE_ME@pgbouncer:5432/surette          # pooled (transaction mode)
  DATABASE_DIRECT_URL: postgresql://surette:CHANGE_ME@surette-db-rw:5432/surette # LISTEN/NOTIFY + migrations
  DATABASE_READ_URL: postgresql://surette:CHANGE_ME@surette-db-ro:5432/surette   # read replicas
  REDIS_URL: redis://redis:6379
  JWT_SECRET: CHANGE_ME_64_RANDOM_CHARS
  METRICS_TOKEN: CHANGE_ME_RANDOM
  CENSUS_API_KEY: ""

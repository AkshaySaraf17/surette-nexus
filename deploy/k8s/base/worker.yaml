apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker }
    spec:
      terminationGracePeriodSeconds: 35   # worker drains in-flight jobs for up to 25 s
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: surette-nexus
          args: ["npm", "run", "worker:prod"]
          ports: [{ name: metrics, containerPort: 9464 }]
          envFrom:
            - configMapRef: { name: surette-config }
            - secretRef: { name: surette-secrets }
          env:
            - { name: SERVICE_NAME, value: surette-worker }
            - { name: WORKER_PORT, value: "9464" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 30
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: storage, mountPath: /data/storage }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: storage, persistentVolumeClaim: { claimName: surette-storage } }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker }
spec:
  selector: { app.kubernetes.io/name: worker }
  ports: [{ name: metrics, port: 9464, targetPort: metrics }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: worker } }

# =============================================================================
# Surette Nexus — API gateway / load balancer (nginx, open source)
#
# Used by docker-compose (service "gateway"). In Kubernetes the same responsibilities
# are handled by ingress-nginx (see deploy/k8s/base/ingress.yaml), configured to match.
#
#   - TLS termination (enable the 443 server below, or terminate at your cloud LB)
#   - load balancing: least-connections across web replicas, keep-alive upstreams,
#     passive health checks (max_fails), safe retries for idempotent requests only
#   - routing: /ws → realtime (WebSocket), /api/events → web (SSE), everything else → web
#   - rate limiting per client IP (coarse; the app adds per-endpoint limits)
#   - micro-caching of public GET responses that declare s-maxage
#   - request ids, JSON access logs, gzip, upload size limits (security headers come from the app)
#   - /api/metrics is never exposed publicly
# =============================================================================
worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65s;

  # ---- request ids: keep a sane incoming X-Request-Id, otherwise use nginx's own -------
  map $http_x_request_id $req_id {
    default   $request_id;
    "~^[A-Za-z0-9_.:-]{8,128}$" $http_x_request_id;
  }

  # ---- JSON access log (shipped to Loki by promtail) -----------------------------------
  log_format json escape=json '{"time":"$time_iso8601","requestId":"$req_id","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"requestTime":$request_time,"upstream":"$upstream_addr","upstreamTime":"$upstream_response_time",'
    '"cache":"$upstream_cache_status","ua":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;

  # ---- rate limiting (per client IP) ---------------------------------------------------
  limit_req_zone  $binary_remote_addr zone=api:20m     rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=auth:10m    rate=10r/m;
  limit_req_zone  $binary_remote_addr zone=collect:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status  429;
  limit_conn_status 429;

  # ---- micro-cache for public GETs (honours the app's Cache-Control s-maxage) ----------
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:20m max_size=512m inactive=10m use_temp_path=off;
  map $http_cookie $has_session { default 0; "~*sn_session=" 1; }
  map "$has_session$http_authorization" $skip_cache { default 1; "0" 0; }

  # ---- upstreams -----------------------------------------------------------------------
  # Re-resolve service names every 10 s (Docker's DNS at 127.0.0.11): containers get new
  # addresses when they're recreated or scaled, and a name resolved only at startup would
  # keep sending traffic to an address that no longer exists (found in testing: 502s after
  # a redeploy). Each replica of a scaled service is a separate upstream server.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream web {
    zone upstream_web 64k;
    least_conn;
    server web:3100 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }
  upstream realtime {
    zone upstream_realtime 64k;
    least_conn;
    server realtime:3200 resolve max_fails=3 fail_timeout=10s;
  }

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  server {
    listen 80;
    server_name _;

    client_max_body_size 30m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;          # the app trusts this one
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $req_id;
    proxy_set_header Connection        "";
    # The gateway sets the response's X-Request-Id itself. Hide the app's copy: otherwise it is
    # sent twice, and a micro-cached response would replay a previous request's id.
    proxy_hide_header X-Request-Id;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    # Retry another replica only for requests that are safe to repeat. nginx never retries
    # POST/PATCH by default (no "non_idempotent"); clients use Idempotency-Key for those.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    include /etc/nginx/security-headers.conf;

    location = /gateway/healthz { access_log off; return 200 "ok\n"; }

    # Internal only: Prometheus scrapes services directly on the private network.
    location = /api/metrics { return 404; }

    # WebSocket live updates → realtime service.
    location = /ws {
      limit_conn perip 20;
      proxy_pass http://realtime;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Server-Sent Events fallback: no buffering, long-lived.
    location = /api/events {
      limit_conn perip 20;
      proxy_pass http://web;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }

    location = /api/auth/login  { limit_req zone=auth burst=5 nodelay; proxy_pass http://web; }
    location = /api/auth/signup { limit_req zone=auth burst=3 nodelay; proxy_pass http://web; }
    location = /api/analytics/collect { limit_req zone=collect burst=40 nodelay; client_max_body_size 64k; proxy_pass http://web; }

    # Listing uploads: up to 40 photos × 30 MB, streamed straight through.
    location = /api/properties/upload {
      limit_req zone=api burst=10;
      client_max_body_size 1200m;
      proxy_request_buffering off;
      proxy_read_timeout 600s;
      proxy_pass http://web;
    }

    # Public read APIs: micro-cached when anonymous and the app allows it (s-maxage).
    location ~ ^/api/(properties|market)$ {
      limit_req zone=api burst=40 nodelay;
      proxy_cache api_cache;
      proxy_cache_bypass $skip_cache;
      proxy_no_cache $skip_cache;
      proxy_cache_lock on;                        # one upstream request per key on a miss
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
      proxy_cache_background_update on;
      add_header X-Cache $upstream_cache_status always;
      include /etc/nginx/security-headers.conf;
      proxy_pass http://web;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://web;
    }

    # Immutable build assets and optimized media: long browser/CDN caching.
    location /_next/static/ { proxy_pass http://web; expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/security-headers.conf; }
    location /media/        { proxy_pass http://web; expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/security-headers.conf; }

    location / { proxy_pass http://web; }
  }

  # ---- TLS (uncomment when the gateway terminates HTTPS itself) -------------------------
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name nexus.example.com;
  #   ssl_certificate     /etc/nginx/tls/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/tls/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  #   ... same locations as above ...
  # }
}

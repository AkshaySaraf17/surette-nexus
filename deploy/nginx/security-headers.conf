# Included wherever a location adds its own headers (nginx drops inherited add_header then).
# Security headers (nosniff, frame, referrer, permissions, HSTS) come from the app itself
# (web/next.config.ts) so they're identical behind any gateway — adding them here too would
# send each header twice. The gateway only adds the request id.
add_header X-Request-Id $req_id always;

# Prometheus for docker-compose (profile "observability"). In Kubernetes use
# kube-prometheus-stack with deploy/k8s/monitoring (ServiceMonitors + PrometheusRule).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: surette-web
    metrics_path: /api/metrics
    authorization:
      credentials_file: /etc/prometheus/metrics-token   # same value as METRICS_TOKEN
    dns_sd_configs:                                     # every replica of the scaled service
      - names: ["web"]
        type: A
        port: 3100
  - job_name: surette-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9464
  - job_name: surette-realtime
    dns_sd_configs:
      - names: ["realtime"]
        type: A
        port: 3200
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]

  # Synthetic checks from outside the app: readiness through the gateway + TLS expiry.
  - job_name: blackbox-ready
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["http://gateway/api/health/ready"]   # add your public https URL in production
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

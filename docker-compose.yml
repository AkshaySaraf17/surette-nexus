# Surette Nexus — full local/staging stack.
#
#   docker compose up --build                          db, redis, migrate, web×2, worker, realtime, gateway
#   docker compose --profile observability up --build  + Prometheus, Alertmanager, Grafana, Loki, Promtail, exporters
#   docker compose --profile ai up                     + Ollama (then: docker compose exec ollama ollama pull llama3.2:3b)
#   docker compose exec web npm run admin:create -- --email you@example.com --name "Your Name"
#
# Site: http://localhost:8080 (through the gateway). Grafana: http://localhost:3001.
# Put JWT_SECRET and METRICS_TOKEN in a .env file next to this one first:
#   printf "JWT_SECRET=%s\nMETRICS_TOKEN=%s\n" "$(openssl rand -hex 32)" "$(openssl rand -hex 16)" > .env
x-build: &build
  context: .
  args: { NEXT_PUBLIC_REALTIME_URL: /ws, NEXT_PUBLIC_SITE_DEMO: "${SITE_DEMO:-true}" }

x-app: &app
  image: surette-nexus:local
  build: *build
  environment: &app-env
    DATABASE_URL: postgresql://surette:${POSTGRES_PASSWORD:-surette-local}@db:5432/surette
    DATABASE_DIRECT_URL: postgresql://surette:${POSTGRES_PASSWORD:-surette-local}@db:5432/surette
    REDIS_URL: redis://redis:6379
    RATE_LIMIT_STORE: redis
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
    PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
    SITE_TEAM_SLUG: surette
    STORAGE_DIR: /data/storage
    OLLAMA_URL: ${OLLAMA_URL:-}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    CENSUS_API_KEY: ${CENSUS_API_KEY:-}
    EMBEDDED_WORKER: "0"
    # Email: Mailpit (free test inbox, http://localhost:8025) unless real SMTP settings are given.
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    MAIL_FROM: ${MAIL_FROM:-Surette Real Estate <no-reply@localhost>}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  volumes: [storage:/data/storage]
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:17
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=500"]
    environment:
      POSTGRES_USER: surette
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surette-local}
      POSTGRES_DB: surette
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surette -d surette"]
      interval: 5s
      retries: 20

  redis:
    # Valkey: the BSD-licensed, Redis-compatible fork (fully free/open source).
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  mailpit:
    # Free local email inbox: catches verification and password-reset emails so nobody real is emailed.
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]
    restart: unless-stopped

  migrate:
    image: surette-nexus:local
    build: *build
    command: ["npm", "run", "db:migrate:prod"]
    environment:
      DATABASE_URL: postgresql://surette:${POSTGRES_PASSWORD:-surette-local}@db:5432/surette
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    <<: *app
    command: ["npm", "start"]
    deploy: { replicas: 2 }
    environment:
      <<: *app-env
      SERVICE_NAME: surette-web

  worker:
    <<: *app
    command: ["npm", "run", "worker:prod"]
    environment:
      <<: *app-env
      SERVICE_NAME: surette-worker
      WORKER_PORT: "9464"
      HEALTH_PORT: "9464"
      HEALTH_PATH: /healthz

  realtime:
    <<: *app
    command: ["npm", "run", "realtime:prod"]
    environment:
      <<: *app-env
      SERVICE_NAME: surette-realtime
      REALTIME_PORT: "3200"
      HEALTH_PORT: "3200"
      HEALTH_PATH: /healthz

  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    depends_on: [web, realtime]
    restart: unless-stopped

  # ---- observability (profile) ------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./.metrics-token:/etc/prometheus/metrics-token:ro      # echo -n "$METRICS_TOKEN" > .metrics-token
      - prometheus:/prometheus
    ports: ["9090:9090"]
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [observability]
    volumes:
      - ./deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/observability/alertmanager/secrets:/etc/alertmanager/secrets:ro
    ports: ["9093:9093"]
  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
  loki:
    image: grafana/loki:3.2.1
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes: ["./deploy/observability/loki/loki.yml:/etc/loki/loki.yml:ro", "loki:/loki"]
  promtail:
    image: grafana/promtail:3.2.1
    profiles: [observability]
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./deploy/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    profiles: [observability]
    environment:
      DATA_SOURCE_NAME: postgresql://surette:${POSTGRES_PASSWORD:-surette-local}@db:5432/surette?sslmode=disable
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0   # works with Valkey
    profiles: [observability]
    environment: { REDIS_ADDR: redis://redis:6379 }
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    profiles: [observability]
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes: ["./deploy/observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro"]

  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    volumes: [ollama:/root/.ollama]

volumes:
  pgdata:
  storage:
  prometheus:
  loki:
  ollama:
